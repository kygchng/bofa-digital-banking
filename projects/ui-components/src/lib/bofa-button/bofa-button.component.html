<button
  [attr.mat-raised-button]="variant !== 'ghost' ? '' : null"
  [attr.mat-button]="variant === 'ghost' ? '' : null"
  [color]="matColor"
  [disabled]="disabled"
  [type]="type"
  [class.bofa-btn-sm]="size === 'sm'"
  [class.bofa-btn-lg]="size === 'lg'"
  [class.bofa-btn-full]="fullWidth">
  <ng-content></ng-content>
</button>
